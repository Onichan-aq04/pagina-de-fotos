<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos de la fiesta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<style>
:root{--bg:#fff7f2;--card:#ffffff;--ink:#2b1d2e;--mut:#7a6a7d;--acc:#e0457b;--acc2:#ff9e5e;--line:#f1dfe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1420;--card:#2a1f2f;--ink:#f8eef5;--mut:#b9a6bd;--line:#3d2d44}}
:root[data-theme="dark"]{--bg:#1c1420;--card:#2a1f2f;--ink:#f8eef5;--mut:#b9a6bd;--line:#3d2d44}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.9rem;margin:.2em 0 .1em;text-align:center}
p.sub{text-align:center;color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
button,label.btn{display:inline-block;border:0;border-radius:999px;padding:14px 26px;font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
#msg{margin-top:14px;min-height:1.4em;color:var(--mut);font-size:.95rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:18px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hide{display:none!important}
#owner{margin-top:28px}
.grid img{cursor:pointer}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#lb img{max-width:100%;max-height:68vh;border-radius:12px;object-fit:contain}
#lb .nav{display:flex;gap:10px;align-items:center;color:#fff}
#lb button{padding:11px 20px}
#lbmsg{color:#ddd;font-size:.9rem;min-height:1.3em}
</style>
</head>
<body>
<main>
  <h1>🎉 ¡Comparte tus fotos!</h1>
  <p class="sub">Sube las fotos que tengas de la fiesta desde tu galería.</p>

  <section class="card" id="up">
    <input id="file" type="file" accept="image/*" multiple hidden>
    <label class="btn" for="file" id="pick">📷 Elegir fotos de mi galería</label>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="msg"></div>
  </section>

  <section class="card hide" id="owner">
    <h2 style="margin-top:0">Galería (solo tú la ves)</h2>
    <div id="count" style="color:var(--mut)"></div>
    <div style="margin-top:6px;color:var(--mut);font-size:.9rem">Toca una foto para verla grande y descargarla en JPG.</div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div id="lb" class="hide">
  <img id="lbimg" alt="">
  <div class="nav"><button class="ghost" id="prev">‹</button><span id="lbn"></span><button class="ghost" id="next">›</button></div>
  <div class="row" style="margin:0"><button id="dl">⬇️ Descargar esta foto (JPG)</button><button class="ghost" id="close" style="color:#fff;border-color:#fff">Cerrar</button></div>
  <div id="lbmsg"></div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var photos=[];

  async function init(){
    var assets=await claude.use("assets");
    var db=await claude.use("db");
    var user=await claude.use("user");

    // Subida (invitados y propietario)
    if(!assets||!db){
      $("pick").classList.add("hide");
      $("msg").textContent="Para subir fotos necesitas abrir este enlace con tu cuenta de Claude y que el anfitrión te haya dado acceso.";
    } else {
      $("file").addEventListener("change",async function(e){
        var files=Array.prototype.slice.call(e.target.files||[]).filter(function(f){return f.type.indexOf("image/")===0});
        e.target.value="";
        if(!files.length)return;
        var uid="anon";
        try{uid=await user.id()}catch(_){}
        $("bar").style.display="block";$("pick").style.pointerEvents="none";
        var ok=0,fail=0;
        for(var i=0;i<files.length;i++){
          $("msg").textContent="Subiendo "+(i+1)+" de "+files.length+"…";
          try{
            var r=await assets.upload(files[i]);
            await db.collection("photos").add({assetId:r.id,by:uid,at:Date.now(),name:files[i].name||"foto"});
            ok++;
          }catch(err){fail++}
          $("fill").style.width=Math.round((i+1)/files.length*100)+"%";
        }
        $("pick").style.pointerEvents="";
        $("msg").textContent=fail?("Subidas: "+ok+". No se pudieron subir: "+fail+". Intenta de nuevo."):("¡Listo! "+ok+(ok===1?" foto subida":" fotos subidas")+" 💖");
        setTimeout(function(){$("bar").style.display="none";$("fill").style.width="0"},1500);
      });
    }

    // Galería y descarga: solo propietario
    var isOwner=false;
    try{isOwner=!!(user&&user.isOwner())}catch(_){}
    if(!isOwner||!db)return;
    $("owner").classList.remove("hide");

    db.collection("photos").onSnapshot(function(snap){
      photos=(snap.docs||[]).map(function(d){return typeof d.data==="function"?d.data():d.data})
        .filter(function(p){return p&&p.assetId}).sort(function(a,b){return (b.at||0)-(a.at||0)});
      $("count").textContent=photos.length+(photos.length===1?" foto":" fotos");
      var g=$("grid");g.textContent="";
      photos.forEach(function(p,i){
        var im=document.createElement("img");im.loading="lazy";im.src="/_blob/"+p.assetId;im.addEventListener("click",function(){show(i)});g.appendChild(im);
      });
      if(!$("lb").classList.contains("hide")){if(photos.length)show(Math.min(cur,photos.length-1));else $("lb").classList.add("hide")}
    },function(){$("count").textContent="No se pudo cargar la galería."});

    var cur=0;
    function show(i){
      if(!photos.length)return;
      cur=(i+photos.length)%photos.length;
      $("lbimg").src="/_blob/"+photos[cur].assetId;
      $("lbn").textContent=(cur+1)+" / "+photos.length;
      $("lbmsg").textContent="";
      $("lb").classList.remove("hide");
    }
    $("prev").addEventListener("click",function(){show(cur-1)});
    $("next").addEventListener("click",function(){show(cur+1)});
    $("close").addEventListener("click",function(){$("lb").classList.add("hide")});

    async function toJpg(b){
      if(b.type==="image/jpeg")return b;
      var bmp=await createImageBitmap(b);
      var c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0);
      return await new Promise(function(res,rej){c.toBlob(function(o){o?res(o):rej(new Error("jpg"))},"image/jpeg",0.95)});
    }
    $("dl").addEventListener("click",async function(){
      var p=photos[cur];if(!p)return;
      var downloads=await claude.use("downloads");
      if(!downloads){$("lbmsg").textContent="La descarga no está disponible en esta vista.";return}
      $("dl").disabled=true;$("lbmsg").textContent="Preparando…";
      try{
        var res=await fetch("/_blob/"+p.assetId);
        var jpg=await toJpg(await res.blob());
        await downloads.save({filename:"foto-"+String(cur+1).padStart(3,"0")+".jpg",data:jpg});
        $("lbmsg").textContent="";
      }catch(err){
        $("lbmsg").textContent=(err&&err.code==="declined")?"Descarga cancelada.":"No se pudo descargar esta foto.";
      }
      $("dl").disabled=false;
    });
  }
  init();
})();
</script>
</body>
</html>
